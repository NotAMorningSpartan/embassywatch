apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: promote-image
  labels:
    app.kubernetes.io/part-of: embassywatch
spec:
  description: >
    Copy the image tag for an application from the source environment
    overlay to the target environment overlay and commit the change.
  workspaces:
    - name: source
      description: The workspace containing the git repo
  params:
    - name: APP_NAME
      type: string
      description: Application name (frontend or backend)
    - name: SOURCE_OVERLAY
      type: string
      description: Path to source overlay (e.g., deploy/overlays/dev)
    - name: TARGET_OVERLAY
      type: string
      description: Path to target overlay (e.g., deploy/overlays/staging)
    - name: SOURCE_ENV
      type: string
    - name: TARGET_ENV
      type: string
    - name: GIT_USER_NAME
      type: string
      default: "tekton-pipeline"
    - name: GIT_USER_EMAIL
      type: string
      default: "tekton@embassywatch.gov"
  steps:
    - name: extract-and-copy
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        apk add --no-cache yq git > /dev/null 2>&1

        SOURCE_FILE="$(params.SOURCE_OVERLAY)/kustomization.yaml"
        TARGET_FILE="$(params.TARGET_OVERLAY)/kustomization.yaml"

        echo "Promoting $(params.APP_NAME) from $(params.SOURCE_ENV) to $(params.TARGET_ENV)"

        # Extract image name and tag from source overlay
        IMAGE_NEW_NAME=$(yq eval ".images[] | select(.name == \"$(params.APP_NAME)\") | .newName" "$SOURCE_FILE")
        IMAGE_NEW_TAG=$(yq eval ".images[] | select(.name == \"$(params.APP_NAME)\") | .newTag" "$SOURCE_FILE")

        if [ -z "$IMAGE_NEW_TAG" ] || [ "$IMAGE_NEW_TAG" = "null" ]; then
          echo "ERROR: No image tag found for $(params.APP_NAME) in $SOURCE_FILE"
          exit 1
        fi

        echo "Found image: $IMAGE_NEW_NAME:$IMAGE_NEW_TAG"

        # Update target overlay
        yq eval -i "
          .images = [
            (.images // [] | .[] | select(.name != \"$(params.APP_NAME)\")),
            {\"name\": \"$(params.APP_NAME)\", \"newName\": \"$IMAGE_NEW_NAME\", \"newTag\": \"$IMAGE_NEW_TAG\"}
          ]
        " "$TARGET_FILE"

        echo "Updated $TARGET_FILE:"
        cat "$TARGET_FILE"

    - name: commit-and-push
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        git config user.name "$(params.GIT_USER_NAME)"
        git config user.email "$(params.GIT_USER_EMAIL)"

        git add "$(params.TARGET_OVERLAY)/kustomization.yaml"

        if git diff --cached --quiet; then
          echo "No changes — source and target already match."
          exit 0
        fi

        git commit -m "chore(deploy): promote $(params.APP_NAME) from $(params.SOURCE_ENV) to $(params.TARGET_ENV)

        Automated by Tekton promote-env pipeline."

        git push origin HEAD
        echo "Promotion committed and pushed. ArgoCD will sync $(params.TARGET_ENV)."
