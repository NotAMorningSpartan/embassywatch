apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: embassywatch-webhook
  labels:
    app.kubernetes.io/part-of: embassywatch
spec:
  serviceAccountName: pipeline
  triggers:
    # Trigger frontend build on push to apps/frontend/ on main
    - name: frontend-push
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
          params:
            - name: filter
              value: >
                body.ref == 'refs/heads/main'
      bindings:
        - ref: github-push-binding
      template:
        ref: build-frontend-trigger

    # Trigger backend build on push to apps/backend/ on main
    - name: backend-push
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
          params:
            - name: filter
              value: >
                body.ref == 'refs/heads/main'
      bindings:
        - ref: github-push-binding
      template:
        ref: build-backend-trigger

  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests:
                    memory: 64Mi
                    cpu: 50m
                  limits:
                    memory: 128Mi
                    cpu: 100m
---
# Route to expose the EventListener externally
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: embassywatch-webhook
  labels:
    app.kubernetes.io/part-of: embassywatch
spec:
  to:
    kind: Service
    name: el-embassywatch-webhook
