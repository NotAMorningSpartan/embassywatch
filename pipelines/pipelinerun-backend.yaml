# Manual PipelineRun for the backend build pipeline.
# Use: oc create -f pipelines/pipelinerun-backend.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-backend-
  labels:
    app.kubernetes.io/part-of: embassywatch
    tekton.dev/pipeline: build-backend
spec:
  pipelineRef:
    name: build-backend
  params:
    - name: GIT_REPO_URL
      value: "https://github.com/NotAMorningSpartan/embassywatch.git"
    - name: GIT_REVISION
      value: main
    - name: IMAGE
      value: "quay.io/tknessmi-rh/embassywatch-backend:latest"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  serviceAccountName: pipeline
  timeout: 30m
