apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-backend
  labels:
    app.kubernetes.io/part-of: embassywatch
    app.kubernetes.io/component: backend
spec:
  description: >
    CI/CD pipeline for the EmbassyWatch backend.
    Clones source, installs deps, lints, runs tests, builds TypeScript,
    builds and pushes container image with Buildah,
    and updates the dev overlay manifest for ArgoCD.

  params:
    - name: GIT_REPO_URL
      type: string
      description: Git repository URL
      default: "https://github.com/NotAMorningSpartan/embassywatch.git"
    - name: GIT_REVISION
      type: string
      description: Git revision to build (branch, tag, or commit SHA)
      default: main
    - name: IMAGE
      type: string
      description: Full image reference including registry, namespace, name, and tag
      default: "quay.io/tknessmi-rh/embassywatch-backend:latest"

  workspaces:
    - name: shared-workspace
      description: Shared workspace for all pipeline tasks

  tasks:
    # Stage 1: Clone
    - name: git-clone
      taskRef:
        name: git-clone
        kind: Task
      params:
        - name: url
          value: $(params.GIT_REPO_URL)
        - name: revision
          value: $(params.GIT_REVISION)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    # Stage 2: Install dependencies
    - name: npm-install
      taskRef:
        name: npm-install
      runAfter:
        - git-clone
      params:
        - name: APP_DIR
          value: apps/backend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 3: Lint (runs in parallel with tests after install)
    - name: npm-lint
      taskRef:
        name: npm-lint
      runAfter:
        - npm-install
      params:
        - name: APP_DIR
          value: apps/backend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 4: Run tests (parallel with lint)
    - name: npm-test
      taskRef:
        name: npm-test
      runAfter:
        - npm-install
      params:
        - name: APP_DIR
          value: apps/backend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 5: Build TypeScript
    - name: npm-build
      taskRef:
        name: npm-build
      runAfter:
        - npm-lint
        - npm-test
      params:
        - name: APP_DIR
          value: apps/backend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 6: Build and push container image
    - name: buildah-build
      taskRef:
        name: buildah
        kind: Task
      runAfter:
        - npm-build
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: DOCKERFILE
          value: apps/backend/Containerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace
