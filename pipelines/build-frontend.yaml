apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-frontend
  labels:
    app.kubernetes.io/part-of: embassywatch
    app.kubernetes.io/component: frontend
spec:
  description: >
    CI/CD pipeline for the EmbassyWatch frontend.
    Clones source, installs deps, runs tests, builds production bundle,
    builds and pushes container image with Buildah.

  params:
    - name: GIT_REPO_URL
      type: string
      description: Git repository URL
      default: "https://github.com/NotAMorningSpartan/embassywatch.git"
    - name: GIT_REVISION
      type: string
      description: Git revision to build (branch, tag, or commit SHA)
      default: main
    - name: IMAGE
      type: string
      description: Full image reference including registry, namespace, name, and tag
      default: "quay.io/tknessmi-rh/embassywatch-frontend:latest"

  workspaces:
    - name: shared-workspace
      description: Shared workspace for all pipeline tasks

  tasks:
    # Stage 1: Clone
    - name: git-clone
      taskRef:
        name: git-clone
        kind: Task
      params:
        - name: url
          value: $(params.GIT_REPO_URL)
        - name: revision
          value: $(params.GIT_REVISION)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    # Stage 2: Install dependencies
    - name: npm-install
      taskRef:
        name: npm-install
      runAfter:
        - git-clone
      params:
        - name: APP_DIR
          value: apps/frontend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 3: Run tests
    - name: npm-test
      taskRef:
        name: npm-test
      runAfter:
        - npm-install
      params:
        - name: APP_DIR
          value: apps/frontend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 4: Build production bundle
    - name: npm-build
      taskRef:
        name: npm-build
      runAfter:
        - npm-test
      params:
        - name: APP_DIR
          value: apps/frontend
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 5: Build and push container image
    - name: buildah-build
      taskRef:
        name: buildah
        kind: Task
      runAfter:
        - npm-build
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: DOCKERFILE
          value: apps/frontend/Containerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "false"
        - name: BUILD_EXTRA_ARGS
          value: "--no-cache"
      workspaces:
        - name: source
          workspace: shared-workspace

    # Stage 6: Restart deployment to pick up new image
    - name: rollout-restart
      taskRef:
        name: rollout-restart
      runAfter:
        - buildah-build
      params:
        - name: DEPLOYMENT_NAME
          value: embassywatch-frontend
        - name: NAMESPACE
          value: embassywatch
