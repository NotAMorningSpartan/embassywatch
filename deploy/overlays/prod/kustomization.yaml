apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: embassywatch-prod

resources:
  - ../../base
  - pdb-frontend.yaml
  - pdb-backend.yaml
  - networkpolicy.yaml

patches:
  # Frontend: 3 replicas, generous resources, anti-affinity
  - target:
      kind: Deployment
      name: embassywatch-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app: embassywatch
                      component: frontend
                  topologyKey: kubernetes.io/hostname

  # Backend: 3 replicas, generous resources, anti-affinity
  - target:
      kind: Deployment
      name: embassywatch-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: "1Gi"
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app: embassywatch
                      component: backend
                  topologyKey: kubernetes.io/hostname

  # HPA: min 3, max 10
  - target:
      kind: HorizontalPodAutoscaler
      name: embassywatch-backend
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10

  # Postgres PVC: 20Gi, more resources
  - target:
      kind: StatefulSet
      name: embassywatch-postgres
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: "1Gi"

  # Redis PVC: 5Gi
  - target:
      kind: StatefulSet
      name: embassywatch-redis
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

  # ConfigMap: production-specific values
  - target:
      kind: ConfigMap
      name: embassywatch-backend-config
    patch: |
      - op: replace
        path: /data/USE_MOCK_DATA
        value: "false"
      - op: add
        path: /data/LOG_LEVEL
        value: "warn"
      - op: replace
        path: /data/NODE_ENV
        value: "production"
