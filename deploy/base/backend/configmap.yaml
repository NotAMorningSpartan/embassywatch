apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: "production"
  PORT: "4000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "embassywatch-db-pass"
  DB_DATABASE: "embassywatch"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  USE_MOCK_DATA: "true"
  LOG_LEVEL: "info"
  RATE_LIMIT_MAX: "1000"
  RATE_LIMIT_WINDOW: "900000"
