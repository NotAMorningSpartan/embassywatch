apiVersion: apps/v1
kind: Deployment
metadata:
  name: embassywatch-backend
  labels:
    app: embassywatch
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: embassywatch
      component: backend
  template:
    metadata:
      labels:
        app: embassywatch
        component: backend
    spec:
      serviceAccountName: embassywatch-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: embassywatch-backend:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: embassywatch-backend-config
            - secretRef:
                name: embassywatch-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: 4000
            failureThreshold: 30
            periodSeconds: 5
