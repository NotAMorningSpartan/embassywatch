apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: embassywatch-redis
  labels:
    app: embassywatch
    component: redis
spec:
  serviceName: embassywatch-redis
  replicas: 1
  selector:
    matchLabels:
      app: embassywatch
      component: redis
  template:
    metadata:
      labels:
        app: embassywatch
        component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 30
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            failureThreshold: 15
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
