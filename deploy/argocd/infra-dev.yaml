apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embassywatch-infra-dev
  namespace: argocd
  labels:
    app: embassywatch
    env: dev
    component: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/NotAMorningSpartan/embassywatch.git
    targetRevision: main
    path: deploy/overlays/dev
    kustomize:
      namePrefix: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: embassywatch-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
